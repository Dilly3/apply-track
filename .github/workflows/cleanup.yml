name: Clean up ApplyTrack

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE to remove the ApplyTrack Cloud Run service"
        required: true
        type: string

concurrency:
  group: applytrack-infrastructure
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DELETE'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: apply-track-028
      TF_VAR_region: us-central1

      # Required by the configuration, but destroy won't deploy this image.
      TF_VAR_image: us-central1-docker.pkg.dev/apply-track-028/applytrack/applytrack:unused

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: apply-track-028
          workload_identity_provider: projects/189593513293/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: applytrack-github-deployer@apply-track-028.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init -lockfile=readonly

      - name: Plan cleanup
        working-directory: infra
        run: |
          terraform plan \
            -destroy \
            -lock-timeout=120s \
            -out=cleanup.tfplan

      - name: Apply cleanup
        working-directory: infra
        run: terraform apply -lock-timeout=120s cleanup.tfplan

      - name: Verify service removal
        shell: bash
        run: |
          SERVICE_NAME="$(gcloud run services list \
            --project=apply-track-028 \
            --region=us-central1 \
            --filter='metadata.name=applytrack' \
            --format='value(metadata.name)')"

          if [[ -n "$SERVICE_NAME" ]]; then
            echo "ApplyTrack still exists."
            exit 1
          fi

          echo "Verified: ApplyTrack Cloud Run service is removed."
